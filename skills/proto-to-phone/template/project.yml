name: App
options:
  bundleIdPrefix: __BUNDLE_PREFIX__
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true
settings:
  base:
    DEVELOPMENT_TEAM: __TEAM_ID__
    CODE_SIGN_STYLE: Automatic
    SWIFT_VERSION: "5.0"
targets:
  App:
    type: application
    platform: iOS
    sources:
      - path: App
      # Folder reference: Xcode copies the whole folder but does NOT notice an
      # in-place edit. sync.sh always cleans the copied bundle before building.
      - path: Web
        type: folder
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: __BUNDLE_ID__
        PRODUCT_NAME: __PRODUCT_NAME__
        INFOPLIST_FILE: App/Info.plist
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        TARGETED_DEVICE_FAMILY: "1"
        MARKETING_VERSION: "1.0"
        CURRENT_PROJECT_VERSION: "1"
        GENERATE_INFOPLIST_FILE: NO
  AppUITests:
    type: bundle.ui-testing
    platform: iOS
    sources: [UITests]
    dependencies:
      - target: App
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: __BUNDLE_ID__.uitests
        GENERATE_INFOPLIST_FILE: YES
        TEST_TARGET_NAME: App
schemes:
  App:
    build:
      targets:
        App: all
        AppUITests: [test]
    test:
      targets: [AppUITests]
